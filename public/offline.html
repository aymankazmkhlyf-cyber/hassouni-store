<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#5a3ff0">
<title>لا يوجد اتصال — حسوني</title>
<style>
  :root { color-scheme: light dark; --bg: #f6f6fb; --fg: #1c1b29; --muted: #66637a; --card: #fff; --brand: #5a3ff0; }
  @media (prefers-color-scheme: dark) { :root { --bg: #121120; --fg: #f1f0f7; --muted: #a9a6bd; --card: #1c1a2e; } }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px; background: var(--bg); color: var(--fg);
         font-family: "Cairo Variable", Tahoma, Arial, sans-serif; line-height: 1.7; }
  main { width: 100%; max-width: 26rem; background: var(--card); border-radius: 20px; padding: 28px 22px; text-align: center;
         box-shadow: 0 10px 30px rgba(20, 16, 60, .08); }
  img { width: 72px; height: 72px; border-radius: 18px; }
  h1 { font-size: 1.3rem; margin: 14px 0 4px; }
  p { margin: 0 0 6px; color: var(--muted); }
  .en { direction: ltr; margin-top: 14px; padding-top: 14px; border-top: 1px solid rgba(127,127,150,.25); }
  a { display: inline-block; margin-top: 16px; background: var(--brand); color: #fff; text-decoration: none; font-weight: 700;
      padding: 10px 22px; border-radius: 12px; }
</style>
</head>
<body>
<main>
  <img src="/icon-192.png" alt="">
  <h1>لا يوجد اتصال بالإنترنت</h1>
  <p>تأكد من الاتصال ثم حاول مرة ثانية. سلتك محفوظة على جهازك.</p>
  <div class="en">
    <p><strong>You are offline.</strong> Check your connection and try again. Your cart is saved on this device.</p>
  </div>
  <a href="/">إعادة المحاولة · Try again</a>
</main>
</body>
</html>
